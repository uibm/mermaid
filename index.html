<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid Diagram Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --fg-color: #000000;
      --accent-color: #4caf50;
    }
    [data-theme="dark"] {
      --bg-color: #1e1e1e;
      --fg-color: #f1f1f1;
      --accent-color: #90caf9;
    }
    body {
      background-color: var(--bg-color);
      color: var(--fg-color);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .button-secondary {
      background-color: #2196f3;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .tab {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
    }
    .tab.active {
      background-color: var(--accent-color);
      color: white;
    }
    #editor {
      height: 300px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    #mermaid-diagram {
      background: #fff !important;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 20px;
      text-align: center;
      overflow: auto;
    }
    #mermaid-diagram svg {
      margin: 0 auto;
      display: block;
      max-width: 100%;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
    .toggle-switch {
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="controls">
      <button onclick="renderMermaid()">Render</button>
      <button class="button-secondary" onclick="downloadDiagram('jpg')">Download JPG</button>
      <button class="button-secondary" onclick="downloadDiagram('png')">Download PNG</button>
      <button class="button-secondary" onclick="downloadSVG()">Download SVG</button>
      <button onclick="saveToLocalStorage()">💾 Save</button>
      <button onclick="loadFromLocalStorage()">📂 Load</button>
      <button onclick="resetEditor()">♻️ Reset</button>
      <label class="toggle-switch">
        🌙 <input type="checkbox" id="theme-toggle" onchange="toggleTheme()" />
      </label>
    </div>

    <div class="tabs" id="example-tabs"></div>
    <div id="editor"></div>
    <div id="mermaid-diagram"></div>
    <div class="error" id="error-message"></div>
  </div>

  <script>
    const EXAMPLES = {
    Flowchart: `flowchart TD\n  Christmas --> |Get money| Money\n  Money --> Shopping[Go shopping]\n  Shopping --> D{Let me think}\n  D -->|One| Laptop\n  D -->|Two| iPhone\n  D -->|Three| Car` ,
    Sequence: `sequenceDiagram\n  participant User\n  participant System\n  participant DB\n  User->>System: Request data\n  System->>DB: Query DB\n  DB-->>System: Return data\n  System-->>User: Respond with data` ,
    Class: `classDiagram\n  class Animal{\n    +String name\n    +int age\n    +speak()\n  }\n  class Dog{\n    +bark()\n  }\n  Animal <|-- Dog` ,
    Gantt: `gantt\n  title Website Project\n  dateFormat  YYYY-MM-DD\n  section Design\n  Wireframes :done, 2025-05-01, 7d\n  Mockups :active, 2025-05-08, 5d\n  section Development\n  Frontend : 2025-05-13, 10d\n  Backend : 2025-05-13, 10d\n  section Testing\n  QA Testing : 2025-05-24, 5d` ,
    ER: `erDiagram\n  PERSON ||--o{ ORDER : places\n  ORDER ||--|{ LINE_ITEM : includes\n  CUSTOMER }|..|{ DELIVERY_ADDRESS : uses\n  PRODUCT ||--o{ LINE_ITEM : part of` ,
    Pie: `pie\n  title Traffic Sources\n  "Organic" : 40\n  "Paid" : 25\n  "Referral" : 20\n  "Social" : 15` ,
    Journey: `journey\n  title Customer Checkout Journey\n  section Purchase Flow\n    Browse : 4: User\n    Add to Cart : 3: User\n    Checkout : 2: User\n    Pay : 1: User` ,
    Timeline: `timeline\n  title Product Lifecycle\n  2020 : Ideation\n  2021 : MVP Released\n  2022 : Series A\n  2023 : Scaling Up\n  2024 : Profitability`
    };


    let editor;
    document.addEventListener("DOMContentLoaded", () => {
      initCodeEditor();
      initTabs();
      renderMermaid();
      const theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') {
        document.body.dataset.theme = 'dark';
        document.getElementById('theme-toggle').checked = true;
      }
    });

    function initCodeEditor() {
      editor = CodeMirror(document.getElementById("editor"), {
        value: EXAMPLES.Flowchart,
        mode: "javascript",
        lineNumbers: true,
        theme: "default"
      });
      editor.on("change", debounce(renderMermaid, 800));
    }

    function initTabs() {
      const tabContainer = document.getElementById("example-tabs");
      Object.keys(EXAMPLES).forEach((name, i) => {
        const tab = document.createElement("div");
        tab.className = "tab";
        if (i === 0) tab.classList.add("active");
        tab.textContent = name;
        tab.onclick = () => {
          document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          editor.setValue(EXAMPLES[name]);
          renderMermaid();
        };
        tabContainer.appendChild(tab);
      });
    }

    async function renderMermaid() {
      const code = editor.getValue();
      const container = document.getElementById("mermaid-diagram");
      const errorDiv = document.getElementById("error-message");
      errorDiv.textContent = "";
      container.innerHTML = "";

      try {
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = code;
        container.appendChild(div);
        await mermaid.run();
      } catch (err) {
        errorDiv.textContent = "Error: " + err.message;
      }
    }

    function downloadDiagram(format) {
    const diagram = document.getElementById("mermaid-diagram");
    const code = editor.getValue();
    const titleMatch = code.match(/title\s*[:=]\s*"?([^\n"]+)/i);
    const safeTitle = titleMatch ? titleMatch[1].trim().replace(/[^\w\d-_]/g, "_") : 'diagram';

    html2canvas(diagram, {
        scale: 4,
        useCORS: true,
        backgroundColor: '#ffffff',
        windowWidth: diagram.scrollWidth,
        windowHeight: diagram.scrollHeight
    }).then(canvas => {
        canvas.toBlob(blob => {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${safeTitle}.${format}`;
        link.click();
        URL.revokeObjectURL(link.href);
        }, `image/${format}`, 0.95);
    });
    }


    function downloadSVG() {
    const svg = document.querySelector('#mermaid-diagram svg');
    if (!svg) {
        alert('No diagram rendered to export.');
        return;
    }
    const code = editor.getValue();
    const titleMatch = code.match(/title\s*[:=]\s*"?([^\n"]+)/i);
    const safeTitle = titleMatch ? titleMatch[1].trim().replace(/[^\w\d-_]/g, "_") : 'diagram';

    const serializer = new XMLSerializer();
    const svgBlob = new Blob([serializer.serializeToString(svg)], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(svgBlob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${safeTitle}.svg`;
    link.click();
    URL.revokeObjectURL(url);
    }



    function debounce(fn, ms) {
      let timer;
      return () => {
        clearTimeout(timer);
        timer = setTimeout(fn, ms);
      };
    }

    function toggleTheme() {
      const dark = document.getElementById('theme-toggle').checked;
      document.body.dataset.theme = dark ? 'dark' : 'light';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    function saveToLocalStorage() {
      localStorage.setItem("mermaid_code", editor.getValue());
      alert("Saved to browser storage");
    }

    function loadFromLocalStorage() {
      const val = localStorage.getItem("mermaid_code");
      if (val) editor.setValue(val);
    }

    function resetEditor() {
      if (confirm("Clear the editor?")) editor.setValue("");
    }
  </script>
</body>
</html>
